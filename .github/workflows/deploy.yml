
name: Build and Deploy JavaEE Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build WAR
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Deploy WAR to Tomcat
        run: |
          set -e
          
          WAR_FILE="target/Pahana-Edu-Bookshop-JavaEE-1.0-SNAPSHOT.war"
          DEPLOY_DIR="/opt/tomcat/webapps"
          APP_NAME="Pahana-Edu-Bookshop-JavaEE-1.0-SNAPSHOT"
          
          test -f "$WAR_FILE"
          
          sudo systemctl stop tomcat
          
          sudo rm -rf "$DEPLOY_DIR/$APP_NAME"
          sudo rm -f "$DEPLOY_DIR/$APP_NAME.war"
          
          sudo install -o tomcat -g tomcat -m 640 \
            "$WAR_FILE" "$DEPLOY_DIR/$APP_NAME.war"
          
          sudo systemctl start tomcat

      - name: Verify Tomcat
        run: |
          systemctl is-active --quiet tomcat
          echo "Tomcat is running."